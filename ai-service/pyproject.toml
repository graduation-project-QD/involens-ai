[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "invoice-ai"
version = "0.1.0"
description = "AI data and inference components for the invoice IDP project"
requires-python = ">=3.11"
dependencies = [
  "Pillow==11.3.0",
  "numpy==1.26.4",
  "opencv-contrib-python==4.10.0.84",
  "opencv-python-headless==4.10.0.84",
  "paddleocr==3.7.0",
  "paddlepaddle==3.3.0",
  "paddlex==3.7.2",
  "pypdfium2==5.13.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
