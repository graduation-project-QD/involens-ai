[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "invoice-ai"
version = "0.1.0"
description = "AI data and inference components for the invoice IDP project"
requires-python = ">=3.11"
dependencies = ["Pillow>=10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
